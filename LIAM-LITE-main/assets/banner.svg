<svg xmlns="http://www.w3.org/2000/svg" width="820" height="150" viewBox="0 0 820 150">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="0" spreadMethod="reflect">
      <stop offset="0" stop-color="#00c6ff"/>
      <stop offset="0.5" stop-color="#ff3cac"/>
      <stop offset="1" stop-color="#00c6ff"/>
      <animate attributeName="x1" values="0;1;0" dur="4s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="1;2;1" dur="4s" repeatCount="indefinite"/>
    </linearGradient>
    <clipPath id="reveal">
      <rect x="0" y="0" width="0" height="150">
        <animate attributeName="width" values="0;820;820;0" keyTimes="0;0.45;0.85;1" dur="6s" repeatCount="indefinite"/>
      </rect>
    </clipPath>
  </defs>
  <g font-family="Segoe UI, Arial, Helvetica, sans-serif" font-weight="800" text-anchor="middle">
    <text x="410" y="70" font-size="62" fill="url(#g)" clip-path="url(#reveal)" letter-spacing="6">LIAM LITE</text>
    <text x="410" y="118" font-size="24" fill="url(#g)" letter-spacing="3">
      PAIR SITE
      <animate attributeName="opacity" values="0.35;1;0.35" dur="2s" repeatCount="indefinite"/>
    </text>
  </g>
</svg>
